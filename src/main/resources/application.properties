spring.application.name=transaction-risk-monitor

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_db
spring.datasource.username=user_furlan 
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

api.security.token.secret=MinhaChaveSecretaMuitoGrandeParaOProjetoFurlan2026

risk.rules.amount.thresholds.20000.0=2
risk.rules.amount.thresholds.50000.0=3
risk.rules.amount.thresholds.100000.0=5

# 2. Score by Transaction Type (Future proof)
risk.rules.type.weights.pix=2
risk.rules.type.weights.transfer=1
risk.rules.type.weights.payment=0

# 3. Time Rules
risk.rules.time.interval-minutes=5
risk.rules.time.duplicate-penalty=4

# 4. Final Classification (The "Labeler")
# If total score >= value, classify as...
risk.classification.levels.critical=10
risk.classification.levels.high=7
risk.classification.levels.medium=4
risk.classification.levels.low=1